name: ping
on:
  push:
    branches: ["main"]
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick curl patch >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/icon-master.png "https://raw.githubusercontent.com/abab92100-cloud/KING-210/a84b2b11eda1487fb7b3f20e1a55bdce7efdb466/assets/app-icon.png"
          convert /tmp/icon-master.png -resize 1024x1024^ -gravity center -extent 1024x1024 /tmp/icon-master.png
          echo PREP_OK
  j_resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick curl >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/i.png "https://raw.githubusercontent.com/abab92100-cloud/KING-210/a84b2b11eda1487fb7b3f20e1a55bdce7efdb466/assets/app-icon.png"
          convert /tmp/i.png -resize 1024x1024^ -gravity center -extent 1024x1024 /tmp/i2.png && echo RESIZE_OK
  j_fg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick curl >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/i.png "https://raw.githubusercontent.com/abab92100-cloud/KING-210/a84b2b11eda1487fb7b3f20e1a55bdce7efdb466/assets/app-icon.png"
          mkdir -p /tmp/res
          convert -size 48x48 xc:none \( /tmp/i.png -resize 31x31 \) -gravity center -composite /tmp/res/fg.png && echo FG_OK
  j_mipmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick curl >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/i.png "https://raw.githubusercontent.com/abab92100-cloud/KING-210/a84b2b11eda1487fb7b3f20e1a55bdce7efdb466/assets/app-icon.png"
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert /tmp/i.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert /tmp/i.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
          done
          echo MIPMAP_OK
  j_capupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm install
          npx cap update android && echo CAP_UPDATE_OK
