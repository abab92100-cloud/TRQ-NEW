name: ping
on:
  push:
    branches: ["main"]
jobs:
  j_node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node -v
  j_assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick curl patch >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/icon.png "https://raw.githubusercontent.com/abab92100-cloud/KING-210/a84b2b11eda1487fb7b3f20e1a55bdce7efdb466/assets/app-icon.png" && echo ICON_OK
  j_engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl patch >/dev/null 2>&1 || true
          sh tools/fetch-engine.sh && echo ENGINE_OK
  j_web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl patch >/dev/null 2>&1 || true
          npm install
          npm run build && echo WEB_OK
  j_server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl patch >/dev/null 2>&1 || true
          npm install
          npm run build:server && echo SERVER_OK && ls -la server-dist/
  j_cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq curl patch >/dev/null 2>&1 || true
          sh tools/fetch-engine.sh
          npm install
          npm run build
          npx cap sync android && echo CAP_OK
  j_decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls plugins/king-native/android/ || true
          mkdir -p plugins/king-native/android/src/main/java/com/abking/nativeplugin
          base64 -d KingNative.java.gz.b64 | gzip -d > plugins/king-native/android/src/main/java/com/abking/nativeplugin/KingNative.java && echo DECODE_OK && wc -c plugins/king-native/android/src/main/java/com/abking/nativeplugin/KingNative.java
