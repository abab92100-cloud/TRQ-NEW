name: Build KING-trading APK + server

on:
  push:
    branches: ["main", "vibe/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      KING_KS_BASE64: ${{ secrets.KING_KEYSTORE_BASE64 }}
      KING_KS_PASS: ${{ secrets.KING_KEYSTORE_PASSWORD }}
      KING_KEY_ALIAS: ${{ secrets.KING_KEY_ALIAS }}
      KING_KEY_PASS: ${{ secrets.KING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Binary assets are generated, not committed (icons/splash/wrapper jar/apk)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick curl patch >/dev/null 2>&1 || true
          curl -sL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar"
          curl -sL -o /tmp/icon-master.png \
            "https://raw.githubusercontent.com/abab92100-cloud/KING-210/main/assets/app-icon.png"
          convert /tmp/icon-master.png -resize 1024x1024^ -gravity center -extent 1024x1024 /tmp/icon-master.png
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert /tmp/icon-master.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert /tmp/icon-master.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            fg=$((s*66/100))
            convert -size ${s}x${s} xc:none \( /tmp/icon-master.png -resize ${fg}x${fg} \) -gravity center -composite $RES/mipmap-$n/ic_launcher_foreground.png
          done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            convert /tmp/icon-master.png -resize 640x960^ -gravity center -extent 640x960 $RES/drawable-port-$d/splash.png 2>/dev/null || true
            convert /tmp/icon-master.png -resize 960x640^ -gravity center -extent 960x640 $RES/drawable-land-$d/splash.png 2>/dev/null || true
          done
          convert /tmp/icon-master.png -resize 640x960 $RES/drawable/splash.png
          convert /tmp/icon-master.png -resize 192x192 public/icon-192.png
          convert /tmp/icon-master.png -resize 512x512 public/icon-512.png
          mkdir -p assets
          cp /tmp/icon-master.png assets/app-icon.png
      - name: Fetch engine.ts (pinned original from KING-210 + engine.patch)
        run: sh tools/fetch-engine.sh
      - name: Decode KingNative.java + gradlew scripts (not committed)
        run: |
          base64 -d KingNative.java.gz.b64 | gzip -d > plugins/king-native/android/src/main/java/com/abking/nativeplugin/KingNative.java
          curl -sL -o android/gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew"
          curl -sL -o android/gradlew.bat "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew.bat"
      - name: Build web + server
        run: |
          npm install
          npm run build
          npm run build:server
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Restore release keystore from secret (never commit it)
        working-directory: android
        run: |
          if [ -n "$KING_KS_BASE64" ]; then
            echo "$KING_KS_BASE64" | base64 -d > king-release.keystore
            cat >> app/build.gradle <<'EOF'
          android.signingConfigs.release {
              storeFile rootProject.file('../king-release.keystore')
              storePassword System.getenv('KING_KS_PASS')
              keyAlias System.getenv('KING_KEY_ALIAS')
              keyPassword System.getenv('KING_KEY_PASS')
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
          fi
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../releases
          cp app/build/outputs/apk/release/app-release.apk ../releases/KING-trading-latest.apk
          cp ../server-dist/ab-king-server.mjs ../releases/trg-server.mjs
      - name: Commit build artifacts back to releases/
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f releases/KING-trading-latest.apk releases/trg-server.mjs
          git commit -m "ci: update KING-trading-latest.apk + trg-server.mjs [skip ci]" || echo "nothing to commit"
          git push
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: king-trading-artifacts
          path: |
            releases/KING-trading-latest.apk
            releases/trg-server.mjs
