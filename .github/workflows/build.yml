name: Build AB-210-TRQ APK + server

on:
  push:
    branches: ["main", "vibe/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Binary assets are generated, not committed (icons/splash/wrapper jar/apk)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick curl patch >/dev/null 2>&1 || true
          curl -fsSL -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar"
          node tools/make-icon.mjs /tmp/icon-master.png || convert -size 1024x1024 xc:'#0a0e14' \
              -fill none -stroke '#f5c518' -strokewidth 30 -draw 'circle 512,512 512,170' \
              -fill '#f5c518' -stroke none -draw 'rectangle 382,400 642,455' -draw 'rectangle 487,400 537,665' \
              /tmp/icon-master.png
          convert /tmp/icon-master.png -resize 1024x1024^ -gravity center -extent 1024x1024 /tmp/icon-master.png
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p $RES/mipmap-$n
            convert /tmp/icon-master.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert /tmp/icon-master.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
            fg=$((s*66/100))
            convert -size ${s}x${s} xc:none \( /tmp/icon-master.png -resize ${fg}x${fg} \) -gravity center -composite $RES/mipmap-$n/ic_launcher_foreground.png
          done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $RES/drawable-port-$d $RES/drawable-land-$d
            convert /tmp/icon-master.png -resize 640x960^ -gravity center -extent 640x960 $RES/drawable-port-$d/splash.png 2>/dev/null || true
            convert /tmp/icon-master.png -resize 960x640^ -gravity center -extent 960x640 $RES/drawable-land-$d/splash.png 2>/dev/null || true
          done
          convert /tmp/icon-master.png -resize 640x960 $RES/drawable/splash.png
          convert /tmp/icon-master.png -resize 192x192 public/icon-192.png
          convert /tmp/icon-master.png -resize 512x512 public/icon-512.png
          mkdir -p assets
          cp /tmp/icon-master.png assets/app-icon.png
      - name: Fetch engine.ts (pinned original from KING-210 + engine.patch)
        run: sh tools/fetch-engine.sh
      - name: Decode KingNative.java + gradlew scripts (not committed)
        run: |
          mkdir -p plugins/king-native/android/src/main/java/com/abking/nativeplugin
          base64 -d KingNative.java.gz.b64 | gzip -d > plugins/king-native/android/src/main/java/com/abking/nativeplugin/KingNative.java
          curl -sL -o android/gradlew "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew"
          curl -sL -o android/gradlew.bat "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew.bat"
      - name: Install deps
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Build server bundle
        run: npm run build:server
      - name: Sync Capacitor Android
        run: npx cap copy android
      - name: Permanent release keystore (stable signing — generated once on first run, then committed)
        run: |
          if [ ! -s king-release.keystore.b64 ]; then
            echo "[keystore] first run: generating permanent release keystore"
            keytool -genkeypair -storetype PKCS12 -keystore king-release.keystore \
              -storepass ab210trq -keypass ab210trq -alias trq \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=AB-210-TRQ, OU=Trading, O=abab92100, C=SA"
            base64 -w0 king-release.keystore > king-release.keystore.b64
          else
            echo "[keystore] using committed permanent keystore"
          fi
          base64 -d king-release.keystore.b64 > king-release.keystore
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../releases
          ls app/build/outputs/apk/release/ && cp app/build/outputs/apk/release/*.apk ../releases/AB-210-TRQ-latest.apk
          cp ../server-dist/ab-king-server.mjs ../releases/trg-server.mjs
      - name: Commit build artifacts back to releases/
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -f releases/AB-210-TRQ-latest.apk releases/trg-server.mjs king-release.keystore.b64
          git commit -m "ci: update AB-210-TRQ-latest.apk + trg-server.mjs [skip ci]" || echo "nothing to commit"
          git push
      - name: Publish GitHub Release (latest) for direct mobile download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.22 releases/AB-210-TRQ-latest.apk releases/trg-server.mjs --title "AB-210-TRQ v1.1.22" --notes "ضخامة v1.1.22 (قرار المالك 8 نوفمبر بعد 3.5 ساعات تشغيل: «صفقات قليلة وربح بسيط»): نمط تكرار أعلى دون مساس بأمان الصفقة الواحدة. أولاً: درجة التأهل انخفضت 68→55 (مع بقاء سيولة 3M والفيتو كاملاً) — المحركات تقبل فرص جيدة بدل ممتازة فقط. ثانياً: هجرة تلقائية للإعدادات المخزنة: انتظار المجموعات 10→5 دقائق ومهلة الثبات 30→15 دقيقة. ثالثاً: دوران البورة بعد 10 دقائق بلا تنفيذ بدل 15. البصمة للتحقق: v1.1.21 fleet-spread veto-escape active55. البصمة للتحقق: v1.1.22 heavy-share. قواعد الحماية كلها باقية حرفياً: لا إغلاق بخسارة، سقف الأمر المنفرد = نصيب المحرك، سقف التعرض 4×، مناطق مختبرة فقط، الفيتو لم يُمس" --latest 2>/dev/null || \
            gh release upload v1.1.22 releases/AB-210-TRQ-latest.apk releases/trg-server.mjs --clobber
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trq-new-artifacts
          path: |
            releases/AB-210-TRQ-latest.apk
            releases/trg-server.mjs
